services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: grepai-postgres
    environment:
      POSTGRES_USER: grepai
      POSTGRES_PASSWORD: grepai
      POSTGRES_DB: grepai
    ports:
      - "5432:5432"
    volumes:
      - grepai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grepai"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

  # Optional: Qdrant for vector storage.
  # Pinned to the version the Go client targets. Bound to loopback: the
  # server has no auth by default. Data lives in a named volume so it
  # survives `docker compose down` and is not written into the checkout.
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: grepai-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333" # HTTP API and dashboard
      - "127.0.0.1:6334:6334" # gRPC API (grepai uses this one)
    volumes:
      - grepai-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - qdrant

  # Optional: Ollama for local embeddings (Linux only)
  # Uncomment the following to run Ollama in Docker
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: grepai-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - grepai-ollama:/root/.ollama
  #   # For GPU support (NVIDIA), add:
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: all
  #   #           capabilities: [gpu]

volumes:
  grepai-pgdata:
  grepai-qdrant:
  # grepai-ollama:
